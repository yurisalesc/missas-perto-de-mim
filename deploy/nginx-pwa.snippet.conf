# Snippet PWA para o site Missas Perto de Mim.
# Inclua no server block HTTPS do nginx (ex.: /etc/nginx/sites-available/missas).
# NÃO substitui o server block inteiro — apenas os trechos necessários.
#
# Se preferir configurar o MIME globalmente, adicione em /etc/nginx/mime.types:
#   application/manifest+json  webmanifest;

location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600";
}

# Service Worker não pode ficar em cache agressivo, senão updates travam.
location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
}

# Ícones PWA
location ^~ /icons/ {
    add_header Cache-Control "public, max-age=604800, immutable";
}
