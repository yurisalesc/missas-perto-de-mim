services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-missa_perto}
      POSTGRES_USER: ${POSTGRES_USER:-missa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-missa_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missa_user -d missa_perto"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - missa_net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    working_dir: /app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/missa_perto.db}
      APP_ENV: ${APP_ENV:-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    volumes:
      - missas_app_data:/app/data
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - missa_net

networks:
  missa_net:
    driver: bridge

volumes:
  pgdata:
    name: missas_pgdata
  missas_app_data:
    name: missas_app_data
