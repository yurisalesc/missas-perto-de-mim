<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <meta name="description" content="Apoie o Missas Perto de Mim com uma doação via Pix." />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <title>Apoie nosso projeto | Missas Perto de Mim</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --line: #e4e8f0;
        --text: #0f172a;
        --muted: #475569;
        --brand: #0f766e;
        --brand-soft: #e6f6f4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(180deg, #eef7f5 0%, var(--bg) 280px);
      }
      .container { width: min(640px, 94vw); margin: 0 auto; padding: 20px 0 36px; }
      .hidden { display: none !important; }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--card);
      }
      .topbar h1 { margin: 0; font-size: 20px; line-height: 1.2; }
      .topbar a {
        color: var(--brand);
        text-decoration: none;
        font-weight: 700;
        white-space: nowrap;
      }
      .topbar a:hover { text-decoration: underline; }
      .card {
        margin-top: 14px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px 16px;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.04);
      }
      .donation h2 { margin: 0 0 6px; font-size: 22px; }
      .donation p { margin: 0 0 10px; color: var(--muted); line-height: 1.5; }
      .donation-note {
        font-size: 13px;
        padding: 10px 12px;
        border-radius: 12px;
        background: var(--brand-soft);
        color: #0b5f59;
        border: 1px solid #bfe8e3;
      }
      .donation-empty {
        margin-top: 8px;
        padding: 12px;
        border-radius: 12px;
        border: 1px dashed var(--line);
        background: #f8fafc;
        color: var(--muted);
      }
      .donation-body { margin-top: 14px; }
      .donation-qr-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 240px;
        margin-bottom: 14px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
      }
      .donation-qr {
        width: 220px;
        height: 220px;
        display: block;
      }
      .donation-loading {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        text-align: center;
      }
      .donation-copy {
        width: 100%;
        border: 1px solid var(--brand);
        border-radius: 11px;
        padding: 12px 14px;
        font-size: 15px;
        font-weight: 700;
        background: var(--brand);
        color: #fff;
        cursor: pointer;
      }
      .donation-copy:disabled {
        opacity: 0.85;
        cursor: default;
      }
      .donation-copy:focus-visible {
        outline: 3px solid #99f6e4;
        outline-offset: 2px;
      }
      .status {
        margin-top: 10px;
        min-height: 18px;
        color: #0b5f59;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="topbar">
        <h1>Missas Perto de Mim</h1>
        <a href="/">Voltar</a>
      </div>

      <main class="card" id="donationRoot"></main>
    </div>
    <script type="module" src="/src/doar.js"></script>
  </body>
</html>
