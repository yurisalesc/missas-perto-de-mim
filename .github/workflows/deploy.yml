name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Precheck SSH connectivity
        run: |
          set -euo pipefail
          echo "Runner public IP:"
          curl -s https://api.ipify.org || true
          echo
          echo "Testing TCP connectivity to ${{ secrets.VPS_HOST }}:22"
          timeout 20 bash -lc 'cat < /dev/null > /dev/tcp/${{ secrets.VPS_HOST }}/22' \
            && echo "Port 22 reachable from runner" \
            || (echo "Port 22 unreachable from runner"; exit 1)

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          debug: true
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/opt/missas-perto-de-mim"
            fi

            cd "$APP_DIR"
            git pull --ff-only origin main

            DB_NAME="${POSTGRES_DB:-missa_perto}"
            DB_USER="${POSTGRES_USER:-missa_user}"
            BACKUP_DIR="${BACKUP_DIR:-/var/backups/missas-perto-de-mim}"
            TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
            BACKUP_FILE="${BACKUP_DIR}/db-${TIMESTAMP}.sql.gz"
            COMPOSE_ARGS="-p missas -f docker-compose.prod.yml"
            mkdir -p "$BACKUP_DIR"

            # Backup current database (if a DB container already exists and is running).
            EXISTING_DB_CONTAINER="$(docker compose $COMPOSE_ARGS ps -q db || true)"
            if [ -n "$EXISTING_DB_CONTAINER" ] && [ "$(docker inspect -f '{{.State.Running}}' "$EXISTING_DB_CONTAINER" 2>/dev/null || echo false)" = "true" ]; then
              echo "Creating PostgreSQL backup at $BACKUP_FILE"
              docker exec "$EXISTING_DB_CONTAINER" pg_dump -U "$DB_USER" "$DB_NAME" | gzip > "$BACKUP_FILE"
              # Keep last 14 backups.
              ls -1t "$BACKUP_DIR"/db-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm -f
            else
              echo "No running DB container found, skipping backup."
            fi

            # Free host port 8000 only (db is internal-only in production).
            API_PORT_CONTAINERS="$(docker ps --filter "publish=8000" --format '{{.ID}}')"
            if [ -n "$API_PORT_CONTAINERS" ]; then
              echo "Stopping containers using host port 8000: $API_PORT_CONTAINERS"
              docker rm -f $API_PORT_CONTAINERS
            fi

            # Keep database container and volume untouched on regular deploys.
            docker compose $COMPOSE_ARGS up -d db
            docker compose $COMPOSE_ARGS up -d --build --no-deps api

            WEB_TMP_DIR="/var/www/missas_tmp_${TIMESTAMP}"
            mkdir -p /var/www/missas "$WEB_TMP_DIR"
            tar -C "$APP_DIR/apps/web" -cf - . \
              | docker run --rm -i -w /app node:22-bookworm bash -lc "set -euo pipefail; mkdir -p /app; tar -xf - -C /app; npx --yes vite build >&2; tar -C /app/dist -cf - ." \
              | tar -C "$WEB_TMP_DIR" -xf -
            mkdir -p "$WEB_TMP_DIR/src"
            cp apps/web/admin.html "$WEB_TMP_DIR/admin.html"
            cp -r apps/web/src/* "$WEB_TMP_DIR/src/"
            sed -i 's|http://127.0.0.1:8000|/api|g' "$WEB_TMP_DIR/src/config.js"

            # Publish web files without clearing live directory first.
            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete "$WEB_TMP_DIR"/ /var/www/missas/
            else
              cp -a "$WEB_TMP_DIR"/. /var/www/missas/
            fi
            rm -rf "$WEB_TMP_DIR"

            chown -R www-data:www-data /var/www/missas || true
            chmod -R 755 /var/www/missas
            nginx -t
            systemctl reload nginx
