name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/opt/missas-perto-de-mim"
            fi

            cd "$APP_DIR"
            git pull --ff-only origin main

            DB_NAME="${POSTGRES_DB:-missa_perto}"
            DB_USER="${POSTGRES_USER:-missa_user}"
            BACKUP_DIR="${BACKUP_DIR:-/var/backups/missas-perto-de-mim}"
            TIMESTAMP="$(date +%Y%m%d-%H%M%S)"
            BACKUP_FILE="${BACKUP_DIR}/db-${TIMESTAMP}.sql.gz"
            COMPOSE_ARGS="-p missas -f docker-compose.prod.yml"
            mkdir -p "$BACKUP_DIR"

            # Backup current database (if a DB container already exists and is running).
            EXISTING_DB_CONTAINER="$(docker compose $COMPOSE_ARGS ps -q db || true)"
            if [ -n "$EXISTING_DB_CONTAINER" ] && [ "$(docker inspect -f '{{.State.Running}}' "$EXISTING_DB_CONTAINER" 2>/dev/null || echo false)" = "true" ]; then
              echo "Creating PostgreSQL backup at $BACKUP_FILE"
              docker exec "$EXISTING_DB_CONTAINER" pg_dump -U "$DB_USER" "$DB_NAME" | gzip > "$BACKUP_FILE"
              # Keep last 14 backups.
              ls -1t "$BACKUP_DIR"/db-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm -f
            else
              echo "No running DB container found, skipping backup."
            fi

            # Remove stale Docker containers that still hold required host ports.
            for PORT in 8000 5432; do
              CONTAINERS="$(docker ps --filter "publish=${PORT}" --format '{{.ID}}')"
              if [ -n "$CONTAINERS" ]; then
                echo "Stopping containers using host port ${PORT}: $CONTAINERS"
                docker rm -f $CONTAINERS
              fi
            done

            docker compose $COMPOSE_ARGS up -d --build --remove-orphans api db
            docker compose $COMPOSE_ARGS restart api

            mkdir -p /var/www/missas
            rm -rf /var/www/missas/*
            tar -C "$APP_DIR/apps/web" -cf - . \
              | docker run --rm -i -w /app node:22-bookworm bash -lc "set -euo pipefail; mkdir -p /app; tar -xf - -C /app; npx --yes vite build >&2; tar -C /app/dist -cf - ." \
              | tar -C /var/www/missas -xf -
            mkdir -p /var/www/missas/src
            cp apps/web/admin.html /var/www/missas/admin.html
            cp -r apps/web/src/* /var/www/missas/src/
            sed -i 's|http://127.0.0.1:8000|/api|g' /var/www/missas/src/config.js

            chown -R www-data:www-data /var/www/missas || true
            chmod -R 755 /var/www/missas
            nginx -t
            systemctl reload nginx
