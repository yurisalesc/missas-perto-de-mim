services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: missa_perto
      POSTGRES_USER: missa_user
      POSTGRES_PASSWORD: missa_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missa_user -d missa_perto"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - missa_net

# MISSAS EM BREVE

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+psycopg://missa_user:missa_pass@db:5432/missa_perto
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - missa_net

networks:
  missa_net:
    driver: bridge
