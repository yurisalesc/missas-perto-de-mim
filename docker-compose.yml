services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-missa_perto}
      POSTGRES_USER: ${POSTGRES_USER:-missa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-missa_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missa_user -d missa_perto"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - missa_net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./apps/api:/app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-missa_user}:${POSTGRES_PASSWORD:-missa_pass}@db:5432/${POSTGRES_DB:-missa_perto}
      APP_ENV: ${APP_ENV:-development}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - missa_net

networks:
  missa_net:
    driver: bridge

volumes:
  pgdata:
